name: List a PrismML build
run-name: List PrismML ${{ inputs.tag }} as candidate for core ${{ inputs.min_core_version || 'default' }} [cid:${{ inputs.candidate_id }}]

# Step 1 of the PrismML update in CI, for the engine update pipeline
# (AtomicBot-ai/atomic-hatchet-pipeline, engine-bump): what
# `make prism-add` does on a laptop. PrismML has no mirror and no signing here:
# cores download the archives straight from PrismML-Eng/llama.cpp and check
# them against the sha256 this list carries (GitHub's asset digest). The tag
# goes in as `candidate`; only cores that allow candidate builds see it until
# prism-approve.yml runs.
#
# Pushed straight to main, like upstream-approve.yml: GitHub Actions may not
# open pull requests in this organization, and the pipeline then checks the
# build in core before anything is approved.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "PrismML release tag (e.g. prism-b10787-73bfe6c)"
        required: true
        type: string
      min_core_version:
        description: "Oldest core the release is listed for (e.g. 0.18.2); empty takes the script's default"
        required: false
        default: ""
        type: string
      candidate_id:
        description: "Id the caller finds this run by in its title"
        required: false
        default: "manual"
        type: string

# The add and the approval rewrite the same list: one writer at a time.
concurrency:
  group: prism-manifest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add:
    name: List as candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Inputs reach scripts through env only, never through `${{ }}` in `run:`.
      - name: Check the inputs
        env:
          TAG: ${{ inputs.tag }}
          MIN_CORE: ${{ inputs.min_core_version }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^prism-b[0-9]+-[0-9a-f]{7}$ ]] || { echo "::error::tag must look like prism-b10787-73bfe6c"; exit 1; }
          if [ -n "$MIN_CORE" ] && ! [[ "$MIN_CORE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::min_core_version must look like 0.18.2"
            exit 1
          fi

      # A tag that is already listed is left as it is: `add` is a no-op then,
      # and the approval sets min_core_version anyway.
      - name: Add the release
        id: add
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          MIN_CORE: ${{ inputs.min_core_version }}
        run: |
          set -euo pipefail
          node .github/scripts/prism-manifest.mjs add --tag "$TAG" \
            ${MIN_CORE:+--min-core-version "$MIN_CORE"}
          if git diff --quiet -- backends/atomic-prism-manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the manifest
        if: steps.add.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm install -g ajv-cli@5
          ajv validate -s backends/atomic-prism-schema.json \
            -d backends/atomic-prism-manifest.json --strict=false
          node .github/scripts/prism-manifest.mjs check

      # Someone may push to main between the checkout and here: rebase onto it
      # and retry instead of failing.
      - name: Commit the manifest
        if: steps.add.outputs.changed == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          MIN="$(node -e "
            const m = require('./backends/atomic-prism-manifest.json')
            console.log(m.releases.find((r) => r.tag === process.argv[1]).min_core_version)
          " "$TAG")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backends/atomic-prism-manifest.json
          git commit -m "chore(prism): list PrismML $TAG as candidate for core >= $MIN"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt): rebasing onto main"
            git pull --rebase
          done
          echo "::error::Could not push the listing of $TAG"
          exit 1
