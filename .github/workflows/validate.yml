name: Validate registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate providers/registry.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ajv-cli
        run: npm install -g ajv-cli@5

      - name: Validate providers registry against schema
        run: |
          ajv validate \
            -s providers/schema.json \
            -d providers/registry.json \
            --strict=false

      - name: Check provider id uniqueness and security invariants
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'providers/registry.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (!Array.isArray(data.providers)) {
            errors.push('providers must be an array')
          } else {
            const ids = new Set()
            for (const p of data.providers) {
              if (ids.has(p.provider)) {
                errors.push(`Duplicate provider id: ${p.provider}`)
              }
              ids.add(p.provider)

              if (p.api_key !== '') {
                errors.push(
                  `Provider "${p.provider}" has a non-empty api_key. ` +
                    'API keys must NEVER be committed to the registry.'
                )
              }

              if (Array.isArray(p.models)) {
                const modelIds = new Set()
                for (const m of p.models) {
                  if (modelIds.has(m.id)) {
                    errors.push(
                      `Provider "${p.provider}" has duplicate model id: ${m.id}`
                    )
                  }
                  modelIds.add(m.id)
                }
              }
            }
          }

          if (typeof data.schema_version !== 'number' || data.schema_version < 1) {
            errors.push('schema_version must be a positive integer')
          }

          if (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at)) {
            errors.push('updated_at must be an ISO-8601 timestamp')
          }

          if (errors.length > 0) {
            console.error('Registry validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('Registry passed all integrity checks.')
          console.log(`  providers: ${data.providers.length}`)
          console.log(`  schema_version: ${data.schema_version}`)
          console.log(`  updated_at: ${data.updated_at}`)
          EOF

      - name: Validate recommended-models manifest against schema
        run: |
          ajv validate \
            -s models/schema.json \
            -d models/recommended.json \
            --strict=false

      - name: Check recommended-models integrity
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'models/recommended.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (typeof data.schema_version !== 'number' || data.schema_version < 1) {
            errors.push('schema_version must be a positive integer')
          }

          if (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at)) {
            errors.push('updated_at must be an ISO-8601 timestamp')
          }

          if (!Array.isArray(data.recommendations)) {
            errors.push('recommendations must be an array')
          } else {
            const seen = new Set()
            for (const r of data.recommendations) {
              const key = `${r.model_name}|${r.description_key}`
              if (seen.has(key)) {
                errors.push(
                  `Duplicate recommendation: ${r.model_name} / ${r.description_key}`
                )
              }
              seen.add(key)
            }
          }

          if (errors.length > 0) {
            console.error('Recommended-models manifest validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('Recommended-models manifest passed all integrity checks.')
          console.log(`  recommendations: ${data.recommendations.length}`)
          console.log(`  schema_version: ${data.schema_version}`)
          console.log(`  updated_at: ${data.updated_at}`)
          EOF

      - name: Validate staff-picks manifest against schema
        run: |
          ajv validate \
            -s models/schema.staff-picks.json \
            -d models/staff-picks.json \
            --strict=false

      - name: Check staff-picks integrity
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'models/staff-picks.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (typeof data.schema_version !== 'number' || data.schema_version < 1) {
            errors.push('schema_version must be a positive integer')
          }

          if (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at)) {
            errors.push('updated_at must be an ISO-8601 timestamp')
          }

          if (!Array.isArray(data.picks)) {
            errors.push('picks must be an array')
          } else {
            const seen = new Set()
            const orders = new Set()
            for (const p of data.picks) {
              if (typeof p.model_name !== 'string' || !p.model_name.includes('/')) {
                errors.push(`Pick model_name must be a "owner/repo" string: ${p.model_name}`)
                continue
              }
              if (seen.has(p.model_name)) {
                errors.push(`Duplicate pick: ${p.model_name}`)
              }
              seen.add(p.model_name)

              if (p.description_key !== undefined && !p.description_key.startsWith('hub:')) {
                errors.push(
                  `Pick "${p.model_name}" description_key must start with "hub:"`
                )
              }

              // MLX runs on Apple Silicon only, so an MLX pick offered to
              // every platform is an entry Windows and Linux can never use.
              if (p.format === 'mlx') {
                const platforms = p.platforms ?? []
                if (platforms.length !== 1 || platforms[0] !== 'macos') {
                  errors.push(
                    `MLX pick "${p.model_name}" must declare platforms: ["macos"]`
                  )
                }
              }

              // A duplicate order makes the list order depend on JSON key
              // ordering, which is not something an editor can reason about.
              if (p.order !== undefined) {
                if (orders.has(p.order)) {
                  errors.push(`Duplicate order ${p.order} on pick ${p.model_name}`)
                }
                orders.add(p.order)
              }
            }
          }

          if (errors.length > 0) {
            console.error('Staff-picks manifest validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('Staff-picks manifest passed all integrity checks.')
          console.log(`  picks: ${data.picks.length}`)
          console.log(`  schema_version: ${data.schema_version}`)
          console.log(`  updated_at: ${data.updated_at}`)
          EOF

      - name: Validate backends manifest against schema
        run: |
          ajv validate \
            -s backends/schema.json \
            -d backends/manifest.json \
            --strict=false

      - name: Check backends manifest integrity
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'backends/manifest.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (typeof data.tag_name !== 'string' || !/^b\d+$/.test(data.tag_name)) {
            errors.push('tag_name must look like a ggml-org release tag (e.g. b9691)')
          }

          if (data.updated_at !== undefined &&
              (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at))) {
            errors.push('updated_at, if present, must be an ISO-8601 timestamp')
          }

          if (data.download_base !== undefined &&
              !/^https:\/\/[^\s]+$/.test(data.download_base)) {
            errors.push('download_base, if present, must be an https URL')
          }

          if (!Array.isArray(data.assets) || data.assets.length === 0) {
            errors.push('assets must be a non-empty array')
          } else {
            const names = new Set()
            for (const a of data.assets) {
              if (typeof a.name !== 'string' || !a.name) {
                errors.push('every asset must have a non-empty string name')
                continue
              }
              if (names.has(a.name)) {
                errors.push(`Duplicate asset name: ${a.name}`)
              }
              names.add(a.name)

              // sha256 and size travel together: the client checks the size
              // first and only then pays for the hash, so a hash without a
              // size silently skips the cheap guard.
              const hasHash = a.sha256 !== undefined
              const hasSize = a.size !== undefined
              if (hasHash !== hasSize) {
                errors.push(
                  `Asset "${a.name}" must declare sha256 and size together (got sha256: ${hasHash}, size: ${hasSize})`
                )
              }
              if (hasHash && !/^[0-9a-f]{64}$/.test(a.sha256)) {
                errors.push(`Asset "${a.name}" has a malformed sha256`)
              }
              if (hasSize && (!Number.isInteger(a.size) || a.size <= 0)) {
                errors.push(`Asset "${a.name}" size must be a positive integer`)
              }
            }

            // A mirrored release must hash everything it hosts, otherwise the
            // client downloads some archives unverified without saying so.
            if (data.download_base) {
              for (const a of data.assets) {
                if (a.name && a.name.startsWith('llama-') && a.sha256 === undefined) {
                  errors.push(
                    `Asset "${a.name}" is served from download_base but carries no sha256`
                  )
                }
              }
            }
            // Every llama-* asset must carry the declared tag, so the
            // client's `llama-<tag>-bin-...` regex actually matches.
            const tag = data.tag_name
            for (const a of data.assets) {
              if (a.name && a.name.startsWith('llama-') && !a.name.startsWith(`llama-${tag}-bin-`)) {
                errors.push(`Asset "${a.name}" does not match declared tag ${tag}`)
              }
            }
          }

          if (errors.length > 0) {
            console.error('Backends manifest validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('Backends manifest passed all integrity checks.')
          console.log(`  tag_name: ${data.tag_name}`)
          console.log(`  assets: ${data.assets.length}`)
          console.log(`  download_base: ${data.download_base ?? '(upstream CDN)'}`)
          EOF

      - name: Validate turboquant manifest against schema
        run: |
          ajv validate \
            -s backends/turboquant-schema.json \
            -d backends/turboquant-manifest.json \
            --strict=false

      - name: Check turboquant manifest integrity
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'backends/turboquant-manifest.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (data.updated_at !== undefined &&
              (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at))) {
            errors.push('updated_at, if present, must be an ISO-8601 timestamp')
          }

          if (!Array.isArray(data.backends) || data.backends.length === 0) {
            errors.push('backends must be a non-empty array')
          } else {
            const ids = new Set()
            const tags = new Set()
            for (const b of data.backends) {
              if (typeof b.id !== 'string' || !b.id) {
                errors.push('every backend must have a non-empty string id')
                continue
              }
              if (ids.has(b.id)) {
                errors.push(`Duplicate backend id: ${b.id}`)
              }
              ids.add(b.id)

              // The fork publishes every variant of a build under ONE release
              // tag, b<upstream-build>-<fork-semver>, e.g. b10018-1.3.0.
              if (typeof b.tag !== 'string' || !/^b\d+-\d+\.\d+\.\d+$/.test(b.tag)) {
                errors.push(
                  `Backend "${b.id}" tag "${b.tag}" must look like b<build>-<major>.<minor>.<patch> (e.g. b10018-1.3.0)`
                )
              } else {
                tags.add(b.tag)
              }

              // Windows ships .zip, Linux/macOS ship .tar.gz. Pinning the
              // extension per platform keeps the client's URL builder exact.
              const ext = b.id.startsWith('windows-') ? 'zip' : 'tar.gz'
              const expected = `llama-turboquant-${b.id}.${ext}`
              if (b.asset !== expected) {
                errors.push(
                  `Backend "${b.id}" asset "${b.asset}" must be ${expected}`
                )
              }
            }

            if (tags.size > 1) {
              errors.push(
                `All backends must come from ONE unified release; found tags: ${[...tags].join(', ')}`
              )
            }
          }

          if (errors.length > 0) {
            console.error('TurboQuant manifest validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('TurboQuant manifest passed all integrity checks.')
          console.log(`  backends: ${data.backends.length}`)
          console.log(`  tag: ${data.backends[0] && data.backends[0].tag}`)
          if (data.commit) console.log(`  commit: ${data.commit}`)
          EOF
