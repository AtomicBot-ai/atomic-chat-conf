name: Validate registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate providers/registry.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ajv-cli
        run: npm install -g ajv-cli@5

      - name: Validate providers registry against schema
        run: |
          ajv validate \
            -s providers/schema.json \
            -d providers/registry.json \
            --strict=false

      - name: Check provider id uniqueness and security invariants
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'providers/registry.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (!Array.isArray(data.providers)) {
            errors.push('providers must be an array')
          } else {
            const ids = new Set()
            for (const p of data.providers) {
              if (ids.has(p.provider)) {
                errors.push(`Duplicate provider id: ${p.provider}`)
              }
              ids.add(p.provider)

              if (p.api_key !== '') {
                errors.push(
                  `Provider "${p.provider}" has a non-empty api_key. ` +
                    'API keys must NEVER be committed to the registry.'
                )
              }

              if (Array.isArray(p.models)) {
                const modelIds = new Set()
                for (const m of p.models) {
                  if (modelIds.has(m.id)) {
                    errors.push(
                      `Provider "${p.provider}" has duplicate model id: ${m.id}`
                    )
                  }
                  modelIds.add(m.id)
                }
              }
            }
          }

          if (typeof data.schema_version !== 'number' || data.schema_version < 1) {
            errors.push('schema_version must be a positive integer')
          }

          if (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at)) {
            errors.push('updated_at must be an ISO-8601 timestamp')
          }

          if (errors.length > 0) {
            console.error('Registry validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('Registry passed all integrity checks.')
          console.log(`  providers: ${data.providers.length}`)
          console.log(`  schema_version: ${data.schema_version}`)
          console.log(`  updated_at: ${data.updated_at}`)
          EOF

      - name: Validate recommended-models manifest against schema
        run: |
          ajv validate \
            -s models/schema.json \
            -d models/recommended.json \
            --strict=false

      - name: Check recommended-models integrity
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'models/recommended.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (typeof data.schema_version !== 'number' || data.schema_version < 1) {
            errors.push('schema_version must be a positive integer')
          }

          if (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at)) {
            errors.push('updated_at must be an ISO-8601 timestamp')
          }

          if (!Array.isArray(data.recommendations)) {
            errors.push('recommendations must be an array')
          } else {
            const seen = new Set()
            for (const r of data.recommendations) {
              const key = `${r.model_name}|${r.description_key}`
              if (seen.has(key)) {
                errors.push(
                  `Duplicate recommendation: ${r.model_name} / ${r.description_key}`
                )
              }
              seen.add(key)
            }
          }

          // The low-spec list REPLACES the standard one on clients that predate
          // `tiers`, so a model in both would be offered on hardware the other
          // list says it is wrong for.
          const standard = new Set(
            (data.recommendations ?? []).map((r) => r.model_name)
          )
          for (const r of data.low_spec_recommendations ?? []) {
            if (standard.has(r.model_name)) {
              errors.push(
                `${r.model_name} appears in both recommendation lists`
              )
            }
          }

          // The tier vocabulary is owned by a client release: a key the shipped
          // client cannot name is silently dropped, leaving that machine on its
          // bundled ladder. Keep this list in sync with `HardwareTier` in
          // web-app/src/lib/hardware-tier.ts.
          const TIERS = [
            'cpu_only',
            'vram_2',
            'vram_4',
            'vram_8',
            'vram_12',
            'vram_16',
            'vram_16_plus',
            'unified_8',
            'unified_16',
            'unified_32',
            'unified_32_plus',
          ]
          const tiers = data.tiers ?? {}
          for (const key of Object.keys(tiers)) {
            if (!TIERS.includes(key)) errors.push(`Unknown tier: ${key}`)
          }
          for (const tier of TIERS) {
            const list = tiers[tier]
            if (list === undefined) {
              errors.push(`Missing tier: ${tier}`)
              continue
            }
            if (!Array.isArray(list) || list.length === 0) {
              errors.push(`Tier ${tier} must be a non-empty array`)
              continue
            }
            const seenInTier = new Set()
            for (const r of list) {
              if (seenInTier.has(r.model_name)) {
                errors.push(`Duplicate entry in tier ${tier}: ${r.model_name}`)
              }
              seenInTier.add(r.model_name)
              // These download unattended. Without a pin the client falls back
              // to its house quant preference and fetches a different file than
              // the ladder was measured on.
              if (!/^[A-Za-z0-9_]{2,16}$/.test(r.quant ?? '')) {
                errors.push(`Tier ${tier}/${r.model_name} must pin a quant`)
              }
            }
          }

          if (errors.length > 0) {
            console.error('Recommended-models manifest validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('Recommended-models manifest passed all integrity checks.')
          console.log(`  recommendations: ${data.recommendations.length}`)
          console.log(`  tiers: ${Object.keys(data.tiers ?? {}).length}`)
          console.log(`  schema_version: ${data.schema_version}`)
          console.log(`  updated_at: ${data.updated_at}`)
          EOF

      - name: Validate staff-picks manifest against schema
        run: |
          ajv validate \
            -s models/schema.staff-picks.json \
            -d models/staff-picks.json \
            --strict=false

      - name: Check staff-picks integrity
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'models/staff-picks.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (typeof data.schema_version !== 'number' || data.schema_version < 1) {
            errors.push('schema_version must be a positive integer')
          }

          if (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at)) {
            errors.push('updated_at must be an ISO-8601 timestamp')
          }

          if (!Array.isArray(data.picks)) {
            errors.push('picks must be an array')
          } else {
            const seen = new Set()
            const orders = new Set()
            for (const p of data.picks) {
              if (typeof p.model_name !== 'string' || !p.model_name.includes('/')) {
                errors.push(`Pick model_name must be a "owner/repo" string: ${p.model_name}`)
                continue
              }
              if (seen.has(p.model_name)) {
                errors.push(`Duplicate pick: ${p.model_name}`)
              }
              seen.add(p.model_name)

              if (p.description_key !== undefined && !p.description_key.startsWith('hub:')) {
                errors.push(
                  `Pick "${p.model_name}" description_key must start with "hub:"`
                )
              }

              // MLX runs on Apple Silicon only, so an MLX pick offered to
              // every platform is an entry Windows and Linux can never use.
              if (p.format === 'mlx') {
                const platforms = p.platforms ?? []
                if (platforms.length !== 1 || platforms[0] !== 'macos') {
                  errors.push(
                    `MLX pick "${p.model_name}" must declare platforms: ["macos"]`
                  )
                }
              }

              // A duplicate order makes the list order depend on JSON key
              // ordering, which is not something an editor can reason about.
              if (p.order !== undefined) {
                if (orders.has(p.order)) {
                  errors.push(`Duplicate order ${p.order} on pick ${p.model_name}`)
                }
                orders.add(p.order)
              }
            }
          }

          if (errors.length > 0) {
            console.error('Staff-picks manifest validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('Staff-picks manifest passed all integrity checks.')
          console.log(`  picks: ${data.picks.length}`)
          console.log(`  schema_version: ${data.schema_version}`)
          console.log(`  updated_at: ${data.updated_at}`)
          EOF

      - name: Validate backends manifest against schema
        run: |
          ajv validate \
            -s backends/schema.json \
            -d backends/manifest.json \
            --strict=false

      - name: Check backends manifest integrity
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'backends/manifest.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (typeof data.tag_name !== 'string' || !/^b\d+$/.test(data.tag_name)) {
            errors.push('tag_name must look like a ggml-org release tag (e.g. b9691)')
          }

          if (data.updated_at !== undefined &&
              (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at))) {
            errors.push('updated_at, if present, must be an ISO-8601 timestamp')
          }

          if (data.download_base !== undefined &&
              !/^https:\/\/[^\s]+$/.test(data.download_base)) {
            errors.push('download_base, if present, must be an https URL')
          }

          if (!Array.isArray(data.assets) || data.assets.length === 0) {
            errors.push('assets must be a non-empty array')
          } else {
            const names = new Set()
            for (const a of data.assets) {
              if (typeof a.name !== 'string' || !a.name) {
                errors.push('every asset must have a non-empty string name')
                continue
              }
              if (names.has(a.name)) {
                errors.push(`Duplicate asset name: ${a.name}`)
              }
              names.add(a.name)

              // sha256 and size travel together: the client checks the size
              // first and only then pays for the hash, so a hash without a
              // size silently skips the cheap guard.
              const hasHash = a.sha256 !== undefined
              const hasSize = a.size !== undefined
              if (hasHash !== hasSize) {
                errors.push(
                  `Asset "${a.name}" must declare sha256 and size together (got sha256: ${hasHash}, size: ${hasSize})`
                )
              }
              if (hasHash && !/^[0-9a-f]{64}$/.test(a.sha256)) {
                errors.push(`Asset "${a.name}" has a malformed sha256`)
              }
              if (hasSize && (!Number.isInteger(a.size) || a.size <= 0)) {
                errors.push(`Asset "${a.name}" size must be a positive integer`)
              }
            }

            // A mirrored release must hash everything it hosts, otherwise the
            // client downloads some archives unverified without saying so.
            if (data.download_base) {
              for (const a of data.assets) {
                if (a.name && a.name.startsWith('llama-') && a.sha256 === undefined) {
                  errors.push(
                    `Asset "${a.name}" is served from download_base but carries no sha256`
                  )
                }
              }
            }
            // Every llama-* asset must carry the declared tag, so the
            // client's `llama-<tag>-bin-...` regex actually matches.
            const tag = data.tag_name
            for (const a of data.assets) {
              if (a.name && a.name.startsWith('llama-') && !a.name.startsWith(`llama-${tag}-bin-`)) {
                errors.push(`Asset "${a.name}" does not match declared tag ${tag}`)
              }
            }
          }

          if (errors.length > 0) {
            console.error('Backends manifest validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('Backends manifest passed all integrity checks.')
          console.log(`  tag_name: ${data.tag_name}`)
          console.log(`  assets: ${data.assets.length}`)
          console.log(`  download_base: ${data.download_base ?? '(upstream CDN)'}`)
          EOF

      - name: Validate turboquant manifest against schema
        run: |
          ajv validate \
            -s backends/turboquant-schema.json \
            -d backends/turboquant-manifest.json \
            --strict=false

      - name: Check turboquant manifest integrity
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'backends/turboquant-manifest.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (data.updated_at !== undefined &&
              (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at))) {
            errors.push('updated_at, if present, must be an ISO-8601 timestamp')
          }

          if (!Array.isArray(data.backends) || data.backends.length === 0) {
            errors.push('backends must be a non-empty array')
          } else {
            const ids = new Set()
            const tags = new Set()
            for (const b of data.backends) {
              if (typeof b.id !== 'string' || !b.id) {
                errors.push('every backend must have a non-empty string id')
                continue
              }
              if (ids.has(b.id)) {
                errors.push(`Duplicate backend id: ${b.id}`)
              }
              ids.add(b.id)

              // The fork publishes every variant of a build under ONE release
              // tag, b<upstream-build>-<fork-semver>, e.g. b10018-1.3.0.
              if (typeof b.tag !== 'string' || !/^b\d+-\d+\.\d+\.\d+$/.test(b.tag)) {
                errors.push(
                  `Backend "${b.id}" tag "${b.tag}" must look like b<build>-<major>.<minor>.<patch> (e.g. b10018-1.3.0)`
                )
              } else {
                tags.add(b.tag)
              }

              // Windows ships .zip, Linux/macOS ship .tar.gz. Pinning the
              // extension per platform keeps the client's URL builder exact.
              const ext = b.id.startsWith('windows-') ? 'zip' : 'tar.gz'
              const expected = `llama-turboquant-${b.id}.${ext}`
              if (b.asset !== expected) {
                errors.push(
                  `Backend "${b.id}" asset "${b.asset}" must be ${expected}`
                )
              }
            }

            if (tags.size > 1) {
              errors.push(
                `All backends must come from ONE unified release; found tags: ${[...tags].join(', ')}`
              )
            }
          }

          if (errors.length > 0) {
            console.error('TurboQuant manifest validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('TurboQuant manifest passed all integrity checks.')
          console.log(`  backends: ${data.backends.length}`)
          console.log(`  tag: ${data.backends[0] && data.backends[0].tag}`)
          if (data.commit) console.log(`  commit: ${data.commit}`)
          EOF

      - name: Validate sd.cpp backends manifest against schema
        run: |
          ajv validate \
            -s backends/sdcpp-schema.json \
            -d backends/sdcpp-manifest.json \
            --strict=false

      - name: Check sd.cpp backends manifest integrity
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'backends/sdcpp-manifest.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (typeof data.tag_name !== 'string' ||
              !/^master-\d+-[0-9a-f]{7}(-a[0-9a-f]{7})?$/.test(data.tag_name)) {
            errors.push('tag_name must look like a leejet release tag (e.g. master-849-d04e895)')
          }

          if (data.download_base !== undefined &&
              !/^https:\/\/[^\s]+$/.test(data.download_base)) {
            errors.push('download_base, if present, must be an https URL')
          }

          // The client installs these whenever the host qualifies; a tag that
          // lacks one silently degrades every such host to the next tier.
          const REQUIRED = [
            'macos-arm64',
            'win-cuda12-x64',
            'win-vulkan-x64',
            'win-cpu-x64',
            'linux-vulkan-x64',
            'linux-cpu-x64',
          ]

          if (!Array.isArray(data.assets) || data.assets.length === 0) {
            errors.push('assets must be a non-empty array')
          } else {
            const backends = new Set()
            const names = new Set()
            for (const a of data.assets) {
              if (typeof a.backend !== 'string' || !a.backend) {
                errors.push('every asset must have a backend id')
                continue
              }
              if (backends.has(a.backend)) errors.push(`Duplicate backend id: ${a.backend}`)
              backends.add(a.backend)
              if (typeof a.name !== 'string' || !/^[A-Za-z0-9._-]+\.(zip|tar\.gz)$/.test(a.name)) {
                errors.push(`Asset "${a.backend}" has a malformed name: ${a.name}`)
              }
              if (names.has(a.name)) errors.push(`Duplicate asset name: ${a.name}`)
              names.add(a.name)

              // sha256 and size travel together: the client checks the size
              // first and only then pays for the hash.
              const hasHash = a.sha256 !== undefined
              const hasSize = a.size !== undefined
              if (hasHash !== hasSize) {
                errors.push(`Asset "${a.backend}" must declare sha256 and size together`)
              }
              // The client only pairs the cudart archive with win-cuda12-x64.
              if ((a.backend === 'win-cudart-cu12') !== (a.companion === true)) {
                errors.push(`Asset "${a.backend}" companion flag does not match its id`)
              }
            }
            for (const id of REQUIRED) {
              if (!backends.has(id)) errors.push(`Missing required backend: ${id}`)
            }
            if (backends.has('win-cuda12-x64') && !backends.has('win-cudart-cu12')) {
              errors.push('win-cuda12-x64 needs its win-cudart-cu12 companion')
            }
            // A mirrored release must hash everything it hosts, otherwise the
            // client downloads some archives unverified without saying so.
            if (data.download_base) {
              for (const a of data.assets) {
                if (a.sha256 === undefined) {
                  errors.push(`Asset "${a.backend}" is served from download_base but carries no sha256`)
                }
              }
            }
          }

          if (errors.length > 0) {
            console.error('sd.cpp backends manifest validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('sd.cpp backends manifest passed all integrity checks.')
          console.log(`  tag_name: ${data.tag_name}`)
          console.log(`  assets: ${data.assets.length}`)
          console.log(`  download_base: ${data.download_base ?? '(upstream CDN)'}`)
          EOF

      - name: Validate diffusion catalog against schema
        run: |
          ajv validate \
            -s models/schema.diffusion.json \
            -d models/diffusion.json \
            --strict=false

      - name: Check diffusion catalog integrity
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = 'models/diffusion.json'
          const data = JSON.parse(fs.readFileSync(path, 'utf8'))
          const errors = []

          if (data.schema_version !== 1) {
            errors.push('schema_version must be 1 (bump SUPPORTED_SCHEMA_VERSION in the client first)')
          }
          if (typeof data.updated_at !== 'string' || !/\d{4}-\d{2}-\d{2}T/.test(data.updated_at)) {
            errors.push('updated_at must be an ISO-8601 timestamp')
          }

          // Mirrors the client's strict parser (web-app/src/services/
          // diffusion-catalog-registry.ts): a name that fails here is a family
          // the app would drop on load.
          const QUANT_FILENAME = /^[A-Za-z0-9._-]+\.gguf$/
          const SIDE_FILENAME = /^[A-Za-z0-9._/-]+\.(gguf|safetensors)$/
          const safeSide = (name) =>
            SIDE_FILENAME.test(name) && name.split('/').every((s) => s.length > 0 && s !== '..')

          // Side files are de-duplicated on disk by repo + file name, so two
          // families that name the same file must agree on what it is.
          const sideFiles = new Map()
          const noteSide = (family, file) => {
            const key = `${file.repo}/${file.filename}`
            const seen = sideFiles.get(key)
            if (seen && (seen.bytes !== file.bytes || seen.sha256 !== file.sha256)) {
              errors.push(`${family}: ${key} disagrees with ${seen.family} on bytes/sha256`)
            }
            if (!seen) sideFiles.set(key, { family, bytes: file.bytes, sha256: file.sha256 })
          }

          const ids = new Set()
          for (const f of data.families ?? []) {
            if (ids.has(f.id)) errors.push(`Duplicate family id: ${f.id}`)
            ids.add(f.id)

            const quantIds = new Set()
            let recommended = 0
            for (const q of f.transformer?.quants ?? []) {
              if (quantIds.has(q.id)) errors.push(`${f.id}: duplicate quant id ${q.id}`)
              quantIds.add(q.id)
              if (!QUANT_FILENAME.test(q.filename)) {
                errors.push(`${f.id}/${q.id}: transformer must be a flat .gguf (got ${q.filename})`)
              }
              if (q.recommended === true) recommended += 1
            }
            if (recommended !== 1) {
              errors.push(`${f.id}: exactly one quant must be recommended (found ${recommended})`)
            }

            if (f.vae) {
              if (!safeSide(f.vae.filename)) errors.push(`${f.id}: unsafe VAE path ${f.vae.filename}`)
              noteSide(f.id, f.vae)
            }
            for (const te of f.text_encoders ?? []) {
              if (!safeSide(te.filename)) errors.push(`${f.id}: unsafe text encoder path ${te.filename}`)
              if (!te.field) errors.push(`${f.id}: text encoder ${te.filename} has no field`)
              noteSide(f.id, te)
            }
            if (f.vae_format === 'flux2' && !f.vae) {
              errors.push(`${f.id}: vae_format without a vae`)
            }

            const { steps, dims, dim_multiple } = f.ranges ?? {}
            if (!Array.isArray(steps) || steps[0] > steps[1]) errors.push(`${f.id}: steps range is inverted`)
            if (!Array.isArray(dims) || dims[0] > dims[1]) errors.push(`${f.id}: dims range is inverted`)
            const d = f.defaults ?? {}
            if (Array.isArray(steps) && (d.steps < steps[0] || d.steps > steps[1])) {
              errors.push(`${f.id}: default steps ${d.steps} outside ${steps}`)
            }
            for (const axis of ['width', 'height']) {
              if (Array.isArray(dims) && (d[axis] < dims[0] || d[axis] > dims[1])) {
                errors.push(`${f.id}: default ${axis} ${d[axis]} outside ${dims}`)
              }
              if (dim_multiple && d[axis] % dim_multiple !== 0) {
                errors.push(`${f.id}: default ${axis} ${d[axis]} is not a multiple of ${dim_multiple}`)
              }
            }
          }

          if (errors.length > 0) {
            console.error('Diffusion catalog validation failed:')
            for (const e of errors) console.error('  - ' + e)
            process.exit(1)
          }

          console.log('Diffusion catalog passed all integrity checks.')
          console.log(`  families: ${data.families.length}`)
          console.log(`  shared side files: ${sideFiles.size}`)
          console.log(`  updated_at: ${data.updated_at}`)
          EOF
