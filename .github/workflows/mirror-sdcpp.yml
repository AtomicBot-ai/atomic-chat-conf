name: Mirror upstream stable-diffusion.cpp

# Takes a leejet/stable-diffusion.cpp release tag, re-signs the Windows and
# macOS binaries with Atomic Chat's certificates, publishes them as a release
# here, and points backends/sdcpp-manifest.json at them.
#
# Same reasoning as mirror-upstream.yml: the client downloads these archives
# at runtime and must not run ad-hoc-signed (macOS) or unsigned (Windows)
# binaries. Linux archives and the NVIDIA-signed cudart companion pass
# through untouched but gain the sha256 the client verifies.
#
# Unlike llama.cpp, upstream asset names embed the CI runner's OS version
# (macOS-26.6.2, Ubuntu-24.04), so every asset is matched here by pattern and
# written to the manifest under an explicit `backend` id. The client selects
# on that id and never derives anything from the file name.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to mirror (e.g. master-849-d04e895)"
        required: true
        type: string
      retain:
        description: "How many mirrored sd.cpp releases to keep (older ones are deleted)"
        required: false
        default: "3"
        type: string
      publish_manifest:
        description: "Commit backends/sdcpp-manifest.json so clients pick the tag up"
        required: false
        default: true
        type: boolean

concurrency:
  group: mirror-sdcpp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  select:
    name: Select assets
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.pick.outputs.windows }}
      macos: ${{ steps.pick.outputs.macos }}
      passthrough: ${{ steps.pick.outputs.passthrough }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate tag
        run: |
          if ! [[ "${{ inputs.tag }}" =~ ^master-[0-9]+-[0-9a-f]{7}$ ]]; then
            echo "::error::tag must look like a leejet release tag (e.g. master-849-d04e895)"
            exit 1
          fi

      # Backend ids are the contract with the client (backends/sdcpp-schema.json
      # enumerates them). Patterns rather than literal names: upstream moves the
      # ROCm minor and the runner OS version between releases.
      - name: Resolve mirrored assets
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('fs')
          const tag = process.env.TAG
          const UPSTREAM = 'leejet/stable-diffusion.cpp'
          const MATRIX = [
            { backend: 'macos-arm64', platform: 'macos', required: true,
              pattern: /^sd-master-[0-9a-f]{7}-bin-Darwin-macOS-[\d.]+-arm64\.zip$/ },
            { backend: 'win-cuda12-x64', platform: 'windows', required: true,
              pattern: /^sd-master-[0-9a-f]{7}-bin-win-cuda12-x64\.zip$/ },
            { backend: 'win-rocm', platform: 'windows', required: false, versioned: true,
              pattern: /^sd-master-[0-9a-f]{7}-bin-win-rocm-(\d+\.\d+)(?:\.\d+)?-x64\.zip$/ },
            { backend: 'win-vulkan-x64', platform: 'windows', required: true,
              pattern: /^sd-master-[0-9a-f]{7}-bin-win-vulkan-x64\.zip$/ },
            { backend: 'win-cpu-x64', platform: 'windows', required: true,
              pattern: /^sd-master-[0-9a-f]{7}-bin-win-cpu-x64\.zip$/ },
            { backend: 'linux-vulkan-x64', platform: 'passthrough', required: true,
              pattern: /^sd-master-[0-9a-f]{7}-bin-Linux-Ubuntu-[\d.]+-x86_64-vulkan\.zip$/ },
            { backend: 'linux-rocm', platform: 'passthrough', required: false, versioned: true,
              pattern: /^sd-master-[0-9a-f]{7}-bin-Linux-Ubuntu-[\d.]+-x86_64-rocm-(\d+\.\d+)(?:\.\d+)?\.zip$/ },
            { backend: 'linux-cpu-x64', platform: 'passthrough', required: true,
              pattern: /^sd-master-[0-9a-f]{7}-bin-Linux-Ubuntu-[\d.]+-x86_64\.zip$/ },
            // NVIDIA's own signed DLLs; mirrored byte-for-byte so download_base
            // applies to every asset the manifest lists.
            { backend: 'win-cudart-cu12', platform: 'passthrough', required: false, companion: true,
              pattern: /^cudart-sd-bin-win-cu12-x64\.zip$/ },
          ]

          async function main() {
            const resp = await fetch(`https://api.github.com/repos/${UPSTREAM}/releases/tags/${tag}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                'User-Agent': 'atomic-chat-conf-mirror-sdcpp',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              },
            })
            if (!resp.ok) throw new Error(`GitHub API ${resp.status} for ${UPSTREAM} tag ${tag}: ${await resp.text()}`)
            const release = await resp.json()
            const selected = []
            const missing = []
            for (const entry of MATRIX) {
              const matches = (release.assets ?? []).filter((a) => entry.pattern.test(a.name))
              if (matches.length === 0) {
                if (entry.required) missing.push(entry.pattern.source)
                continue
              }
              if (matches.length > 1) throw new Error(`${entry.backend}: ${matches.length} assets match ${entry.pattern.source}`)
              const asset = matches[0]
              const version = entry.versioned ? entry.pattern.exec(asset.name)[1] : null
              selected.push({
                backend: entry.versioned ? `${entry.backend}-${version}-x64` : entry.backend,
                name: asset.name,
                size: asset.size,
                platform: entry.platform,
                companion: entry.companion === true,
                url: `https://github.com/${UPSTREAM}/releases/download/${tag}/${asset.name}`,
              })
            }
            if (missing.length > 0) throw new Error(`Upstream tag ${tag} is missing required assets:\n  ${missing.join('\n  ')}`)
            selected.sort((a, b) => a.backend.localeCompare(b.backend))
            fs.writeFileSync('assets.json', JSON.stringify({ tag, assets: selected }, null, 2) + '\n')
            for (const a of selected) console.error(`  ${a.platform.padEnd(12)} ${a.backend.padEnd(20)} ${a.name} (${(a.size / 1024 ** 2).toFixed(1)} MiB)`)
          }
          main().catch((err) => { console.error(err.message); process.exit(1) })
          EOF
          for platform in windows macos passthrough; do
            list="$(jq -c "[.assets[] | select(.platform == \"$platform\")]" assets.json)"
            echo "$platform=$list" >> "$GITHUB_OUTPUT"
          done

      # The publish job needs the backend-id mapping back; the signed
      # artifacts only carry file names.
      - uses: actions/upload-artifact@v4
        with:
          name: sdcpp-selection
          path: assets.json
          retention-days: 1

  sign-macos:
    name: Sign macOS (${{ matrix.asset.name }})
    needs: select
    runs-on: macos-latest
    strategy:
      matrix:
        asset: ${{ fromJSON(needs.select.outputs.macos) }}
    steps:
      - uses: actions/checkout@v4

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          # The keychain lives and dies with this job, so its password is
          # generated here rather than kept as a secret.
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the imported keychain"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"

      - name: Download upstream archive
        run: curl -fSL --retry 5 --retry-delay 3 -o "${{ matrix.asset.name }}" "${{ matrix.asset.url }}"

      # Upstream ships zips, and the layout inside (flat, or one folder) has
      # changed between releases, so the archive is signed in place and
      # repacked with whatever structure it came with. The client's plugin
      # locates sd-server itself when it finalizes the install.
      - name: Sign Mach-O binaries
        run: |
          set -euo pipefail
          mkdir extract
          unzip -q "${{ matrix.asset.name }}" -d extract

          signed=0
          while IFS= read -r bin; do
            if file "$bin" | grep -q "Mach-O"; then
              codesign --force --options runtime --timestamp \
                --entitlements .github/entitlements.plist \
                --sign "$CODESIGN_IDENTITY" "$bin"
              codesign --verify --strict "$bin"
              signed=$((signed + 1))
            fi
          done < <(find extract -type f)

          if [ "$signed" -eq 0 ]; then
            echo "::error::no Mach-O binaries found in ${{ matrix.asset.name }}"
            exit 1
          fi
          echo "Signed $signed Mach-O binaries"

          server="$(find extract -type f -name sd-server | head -1)"
          if [ -z "$server" ]; then
            echo "::error::sd-server missing from ${{ matrix.asset.name }}"
            exit 1
          fi
          "$server" --help 2>&1 | head -3 || true

      - name: Repack
        run: |
          set -euo pipefail
          rm -f "${{ matrix.asset.name }}"
          (cd extract && zip -qr "../${{ matrix.asset.name }}" .)
          rm -rf extract

      - name: Verify signatures survived the round trip
        run: |
          set -euo pipefail
          mkdir verify
          unzip -q "${{ matrix.asset.name }}" -d verify
          server="$(find verify -type f -name sd-server | head -1)"
          codesign -dv --verbose=2 "$server" 2>&1 | grep -E "Authority|TeamIdentifier|flags"
          codesign --verify --strict "$server"
          rm -rf verify

      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.asset.name }}
          path: ${{ matrix.asset.name }}
          retention-days: 1

  sign-windows:
    name: Sign Windows (${{ matrix.asset.name }})
    needs: select
    runs-on: windows-latest
    strategy:
      # One job per archive: the CUDA and ROCm archives are hundreds of
      # megabytes each and signing them in sequence would blow the job timeout.
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.select.outputs.windows) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream archive
        shell: pwsh
        run: curl.exe -fSL --retry 5 --retry-delay 3 -o "${{ matrix.asset.name }}" "${{ matrix.asset.url }}"

      - name: Extract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extract | Out-Null
          7z x "${{ matrix.asset.name }}" -oextract -bso0 -bsp0
          Remove-Item "${{ matrix.asset.name }}"

      - name: Sign binaries
        uses: ./.github/actions/windows-code-sign
        with:
          path: extract
          sm-api-key: ${{ secrets.SM_API_KEY }}
          sm-client-cert-b64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          sm-client-cert-password: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Repack
        shell: pwsh
        run: |
          # 7-Zip, not Compress-Archive: the latter is single-threaded and needs
          # double-digit minutes on the CUDA and ROCm archives.
          Push-Location extract
          7z a -tzip -mx=5 -mmt=on "..\${{ matrix.asset.name }}" * -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "7z failed to repack" }
          Pop-Location
          Remove-Item -Recurse -Force extract

      - name: Verify signatures survived the round trip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path verify | Out-Null
          7z x "${{ matrix.asset.name }}" -overify -bso0 -bsp0
          $server = Get-ChildItem -Path verify -Recurse -Filter "sd-server.exe" | Select-Object -First 1
          if (-not $server) { throw "sd-server.exe missing from repacked archive" }
          signtool verify /pa $server.FullName
          if ($LASTEXITCODE -ne 0) { throw "repacked sd-server.exe is not signed" }
          Remove-Item -Recurse -Force verify

      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.asset.name }}
          path: ${{ matrix.asset.name }}
          retention-days: 1

  passthrough:
    name: Pass through (${{ matrix.asset.name }})
    needs: select
    runs-on: ubuntu-latest
    strategy:
      matrix:
        asset: ${{ fromJSON(needs.select.outputs.passthrough) }}
    steps:
      # No Linux code-signing mechanism exists here, and the cudart companion
      # holds NVIDIA's own signed DLLs. Both are mirrored byte-for-byte; they
      # still gain the sha256 the client verifies.
      - name: Download upstream archive
        run: curl -fSL --retry 5 --retry-delay 3 -o "${{ matrix.asset.name }}" "${{ matrix.asset.url }}"

      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.asset.name }}
          path: ${{ matrix.asset.name }}
          retention-days: 1

  publish:
    name: Publish release and manifest
    needs: [select, sign-macos, sign-windows, passthrough]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect signed assets
        uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: dist
          merge-multiple: true

      - name: Collect the backend-id selection
        uses: actions/download-artifact@v4
        with:
          name: sdcpp-selection
          path: selection

      - name: Show what will be published
        run: ls -la dist

      # The release must exist and hold every asset BEFORE the manifest moves:
      # clients resolve download URLs from the manifest, so the reverse order
      # would hand them 404s for as long as the upload took.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets"
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          {
            printf 'Mirror of [leejet/stable-diffusion.cpp %s](https://github.com/leejet/stable-diffusion.cpp/releases/tag/%s).\n\n' "$TAG" "$TAG"
            printf 'Windows binaries are Authenticode-signed and macOS binaries carry a Developer ID signature with hardened runtime. Linux archives and the CUDA runtime companion are mirrored byte-for-byte.\n\n'
            printf 'Consumed by Atomic Chat through `backends/sdcpp-manifest.json`.\n'
          } > notes.md
          gh release create "$TAG" dist/* \
            --title "stable-diffusion.cpp $TAG (signed mirror)" \
            --notes-file notes.md

      - name: Regenerate backends/sdcpp-manifest.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const { createHash } = require('crypto')
          const fs = require('fs')
          const path = require('path')
          const tag = process.env.TAG
          const selection = JSON.parse(fs.readFileSync('selection/assets.json', 'utf8'))
          if (selection.tag !== tag) throw new Error(`selection is for ${selection.tag}, not ${tag}`)
          const assets = []
          for (const entry of selection.assets) {
            const file = path.join('dist', entry.name)
            if (!fs.existsSync(file)) throw new Error(`${entry.name} was selected but not published`)
            const sha256 = createHash('sha256').update(fs.readFileSync(file)).digest('hex')
            const size = fs.statSync(file).size
            const asset = { backend: entry.backend, name: entry.name, sha256, size }
            if (entry.companion) asset.companion = true
            assets.push(asset)
          }
          const manifest = {
            $schema: './sdcpp-schema.json',
            updated_at: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'),
            upstream_repo: 'leejet/stable-diffusion.cpp',
            tag_name: tag,
            download_base: 'https://github.com/AtomicBot-ai/atomic-chat-conf/releases/download',
            assets,
          }
          fs.writeFileSync('backends/sdcpp-manifest.json', JSON.stringify(manifest, null, 2) + '\n')
          console.error(`Wrote backends/sdcpp-manifest.json: tag ${tag}, ${assets.length} asset(s)`)
          EOF

      - name: Validate the regenerated manifest
        run: |
          npm install -g ajv-cli@5
          ajv validate -s backends/sdcpp-schema.json -d backends/sdcpp-manifest.json --strict=false

      - name: Commit manifest
        if: ${{ inputs.publish_manifest }}
        run: |
          set -euo pipefail
          if git diff --quiet backends/sdcpp-manifest.json; then
            echo "Manifest already points at ${{ inputs.tag }}; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backends/sdcpp-manifest.json
          git commit -m "chore(sdcpp-manifest): mirror upstream ${{ inputs.tag }}"
          git push

      - name: Prune old mirrored releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RETAIN="${{ inputs.retain }}"
          if ! [[ "$RETAIN" =~ ^[0-9]+$ ]] || [ "$RETAIN" -lt 1 ]; then
            echo "::error::retain must be a positive integer"
            exit 1
          fi
          # Only sd.cpp tags (master-<n>-<sha>), sorted by build number rather
          # than date: a re-run of an older tag would otherwise look like the
          # newest release and evict a current one. llama.cpp's b<n> tags are
          # a different stream and are never touched here.
          mapfile -t stale < <(
            gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | grep -E '^master-[0-9]+-[0-9a-f]{7}$' \
              | sort -t - -k2,2nr \
              | tail -n +$((RETAIN + 1))
          )
          if [ ${#stale[@]} -eq 0 ]; then
            echo "Nothing to prune (retaining $RETAIN)"
            exit 0
          fi
          for tag in "${stale[@]}"; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
